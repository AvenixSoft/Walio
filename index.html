<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Walio — Update in progress</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Walio">
  <meta name="theme-color" content="#2563EB">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E3A8A">

  <!-- Icons -->
  <link rel="icon" type="image/png" href="2.png">
  <link rel="apple-touch-icon" href="2.png">

  <style>
/*
 * Walio — Update screen
 * Built on the exact app design system (Backup_Walio.html):
 * immersive blue hero (#2563EB / #1E3A8A dark) with the dotted light pattern,
 * glass cards (--card-bg, --shadow-glass), .btn-primary-full styling,
 * .lang-btn pills, Inter / Vazirmatn. Default language: English.
 */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

/* ================= THEME CSS VARIABLES (from app) ================= */
:root,
[data-theme="dark"] {
  --bg-main: #0A0A0E;
  --bg-sub: #121218;
  --card-bg: rgba(26, 26, 36, 0.65);
  --glass-bg: rgba(22, 22, 32, 0.75);
  --border-glass: rgba(255, 255, 255, 0.12);
  --border-subtle: rgba(255, 255, 255, 0.08);

  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;

  --accent-primary: #4F46E5;
  --accent-gradient: linear-gradient(135deg, #4F46E5 0%, #3B82F6 50%, #10B981 100%);
  --accent-glow: rgba(79, 70, 229, 0.35);

  --color-green: #10B981;
  --color-green-bg: rgba(16, 185, 129, 0.15);
  --chip-bg: rgba(255, 255, 255, 0.07);
  --chip-bg-strong: rgba(255, 255, 255, 0.12);
  --shadow-glass: 0 10px 28px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.06);
  --header-bg: rgba(18, 18, 26, 0.72);

  --hero-bg: #1E3A8A;
  --hero-shadow: 0 6px 16px rgba(6, 20, 60, 0.45);

  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --radius-xl: 24px;
  --radius-lg: 18px;
  --radius-md: 14px;
  --radius-sm: 10px;
}

[data-theme="light"] {
  --bg-main: #F4F6FB;
  --bg-sub: #E8EDF5;
  --card-bg: rgba(255, 255, 255, 0.82);
  --glass-bg: rgba(255, 255, 255, 0.88);
  --border-glass: rgba(0, 0, 0, 0.08);
  --border-subtle: rgba(0, 0, 0, 0.05);

  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;

  --accent-primary: #4F46E5;
  --accent-gradient: linear-gradient(135deg, #4F46E5 0%, #2563EB 50%, #059669 100%);
  --accent-glow: rgba(79, 70, 229, 0.18);

  --color-green: #059669;
  --color-green-bg: rgba(5, 150, 105, 0.12);
  --chip-bg: rgba(15, 23, 42, 0.06);
  --chip-bg-strong: rgba(15, 23, 42, 0.10);
  --shadow-glass: 0 10px 28px rgba(15, 23, 42, 0.06), inset 0 1px 1px rgba(255, 255, 255, 0.8);
  --header-bg: rgba(244, 246, 251, 0.72);

  --hero-bg: #2563EB;
  --hero-shadow: 0 6px 16px rgba(15, 40, 120, 0.18);
}

/* RTL Persian mode (same as app) */
html[lang="fa"] body {
  --font-main: 'Vazirmatn', 'Inter', Tahoma, sans-serif;
}

/* ================= RESET & BASE ================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  scrollbar-width: none;
  -ms-overflow-style: none;
  /* nothing on the page is selectable, like a native app */
  -webkit-user-select: none;
  user-select: none;
}
*::-webkit-scrollbar { width: 0; height: 0; display: none; background: transparent; }

html {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  /* locked viewport: no scrolling, no rubber-band (native-app behavior) */
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: var(--font-main);
  background: var(--bg-main);
  color: var(--text-primary);
  font-size: clamp(14px, 3.5vw, 15px);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ================= SCREEN FRAME ================= */
.screen {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-main);
}
@media (min-width: 640px) {
  body { display: grid; place-items: center; padding: 24px 0; background: var(--bg-sub); }
  .screen {
    width: 440px;
    height: calc(100dvh - 48px);
    border-radius: 46px;
    box-shadow: 0 0 0 1px var(--border-glass), 0 30px 70px rgba(0, 0, 0, 0.35);
  }
}

/* ================= IMMERSIVE BLUE ZONE + GLASS HERO =================
   Same construction as the app home screen: one continuous flat blue
   slab (status bar → topbar → hero) with the .home-overview-hero glass
   card floating on top — orbital ring, dot grid, glow orbs. */
.hero {
  position: relative;
  background: var(--hero-bg);
  color: #fff;
  padding-bottom: 18px;
  flex: none;
}

/* ---- floating glass card (.home-overview-hero) ---- */
.hero-glass {
  position: relative;
  isolation: isolate;
  margin: 8px 14px 0;
  padding: 20px 20px 24px;
  overflow: hidden;
  color: #fff;
  background: linear-gradient(160deg,
    rgba(255, 255, 255, 0.20) 0%,
    rgba(255, 255, 255, 0.08) 42%,
    rgba(255, 255, 255, 0.04) 100%);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 28px;
  box-shadow:
    0 20px 44px rgba(15, 40, 120, 0.22),
    0 1px 0 rgba(255, 255, 255, 0.28) inset,
    0 -1px 0 rgba(15, 40, 120, 0.08) inset;
  backdrop-filter: blur(22px) saturate(165%);
  -webkit-backdrop-filter: blur(22px) saturate(165%);
}

/* soft orbital ring decoration inside the glass */
.hero-glass::before {
  content: '';
  position: absolute;
  z-index: 0;
  top: -80px;
  right: -60px;
  width: 210px;
  height: 210px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.20);
  box-shadow:
    0 0 0 26px rgba(255, 255, 255, 0.04),
    0 0 0 54px rgba(255, 255, 255, 0.025),
    0 0 50px rgba(147, 197, 253, 0.18);
  background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.18), transparent 55%);
  pointer-events: none;
  animation: heroOrbFloat 12s ease-in-out infinite;
}
html[dir="rtl"] .hero-glass::before { right: auto; left: -60px; }

/* bottom light + subtle dot grid inside the glass */
.hero-glass::after {
  content: '';
  position: absolute;
  z-index: 0;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background:
    radial-gradient(ellipse 80% 55% at 20% 110%, rgba(255, 255, 255, 0.16), transparent 55%),
    radial-gradient(ellipse 50% 40% at 90% 80%, rgba(191, 219, 254, 0.14), transparent 50%),
    radial-gradient(rgba(255, 255, 255, 0.45) 0.55px, transparent 0.55px);
  background-size: auto, auto, 15px 15px;
  opacity: 0.85;
  mask-image: linear-gradient(to bottom, #000 0%, #000 60%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 60%, transparent 100%);
}

@keyframes heroOrbFloat {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  50% { transform: translate(-8px, 10px) rotate(4deg); }
}

/* glow orbs inside the glass (same as .home-hero-glow) */
.hero-glow {
  position: absolute;
  z-index: 0;
  pointer-events: none;
  border-radius: 50%;
  filter: blur(28px);
  opacity: 0.55;
}
.hero-glow--a {
  width: 140px; height: 140px;
  top: -30px; left: -20px;
  background: rgba(125, 211, 252, 0.55);
  animation: heroGlowPulse 7s ease-in-out infinite;
}
.hero-glow--b {
  width: 110px; height: 110px;
  bottom: 20px; right: -10px;
  background: rgba(165, 180, 252, 0.5);
  animation: heroGlowPulse 9s ease-in-out infinite reverse;
}
html[dir="rtl"] .hero-glow--a { left: auto; right: -20px; }
html[dir="rtl"] .hero-glow--b { right: auto; left: -10px; }

@keyframes heroGlowPulse {
  0%, 100% { opacity: 0.45; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.12); }
}

/* ---- glass content: label row → brand → tagline ---- */
.hero-inner { position: relative; z-index: 2; }

.hero-status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 13px;
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.22);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.2px;
  color: rgba(255, 255, 255, 0.96);
  text-shadow: 0 1px 8px rgba(15, 40, 120, 0.25);
}
/* English reads sharper as a small-caps label */
html[lang="en"] .hero-status {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.hero-status .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #34D399;
  box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
  animation: dotPulse 1.9s ease-out infinite;
}
@keyframes dotPulse {
  0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
  100% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
}

.brand {
  display: block;
  margin-top: 16px;
  font-family: 'Inter', var(--font-main);
  font-size: clamp(40px, 11vw, 46px);
  font-weight: 800;
  letter-spacing: -1.8px;
  line-height: 1.05;
  background: linear-gradient(100deg,
    #FFFFFF 0%, #FFFFFF 38%,
    #BFDBFE 50%,
    #FFFFFF 62%, #DCE8FF 100%);
  background-size: 230% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  filter: drop-shadow(0 2px 12px rgba(15, 40, 120, 0.30));
  animation: brandShine 7s ease-in-out infinite;
}
@keyframes brandShine {
  0%, 72% { background-position: 130% 0; }
  88%, 100% { background-position: -30% 0; }
}
.hero-tagline {
  margin-top: 10px;
  max-width: 310px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.7;
  color: rgba(255, 255, 255, 0.88);
}
html[lang="en"] .hero-tagline { letter-spacing: 0.1px; }

/* ---- hero topbar: language pills + theme (white-on-blue controls) ---- */
.hero-topbar {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding:
    max(14px, calc(env(safe-area-inset-top, 0px) + 12px))
    clamp(16px, 4vw, 20px)
    8px;
}

.lang-group { display: flex; gap: 6px; }
.lang-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.14);
  color: rgba(255, 255, 255, 0.92);
  font-family: var(--font-main);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: background .25s ease, color .25s ease, transform .2s cubic-bezier(.16,1,.3,1);
}
.lang-btn:active { transform: scale(0.94); }
.lang-btn.active {
  background: #fff;
  border-color: #fff;
  color: var(--hero-bg);
  font-weight: 700;
  box-shadow: var(--hero-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}

.hero-icon-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255, 255, 255, 0.98);
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 50%;
  box-shadow: var(--hero-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: background .25s ease, transform .2s cubic-bezier(.16,1,.3,1);
}
.hero-icon-btn:hover { background: rgba(255, 255, 255, 0.26); }
.hero-icon-btn:active { transform: scale(0.9); }
.hero-icon-btn .icon-moon { display: none; }
[data-theme="dark"] .hero-icon-btn .icon-sun { display: none; }
[data-theme="dark"] .hero-icon-btn .icon-moon { display: block; }

/* ================= BODY ================= */
.body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 26px clamp(18px, 5vw, 26px) calc(20px + env(safe-area-inset-bottom, 0px));
}

/* short viewports: the page never scrolls, so compress instead */
@media (max-height: 660px) {
  .hero { padding-bottom: 12px; }
  .hero-glass { margin-top: 4px; padding: 14px 18px 18px; }
  .brand { font-size: 32px; margin-top: 10px; }
  .hero-tagline { margin-top: 6px; }
  .body { padding-top: 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .timer { margin: 12px 0 2px; }
  .card-note { margin: 10px 0 14px; }
  .screen-footer { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
}

/* ---- glass card (.hero-balance-card pattern) ---- */
.update-card {
  position: relative;
  width: 100%;
  max-width: 360px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-xl);
  padding: clamp(18px, 5vw, 24px);
  box-shadow: var(--shadow-glass);
  overflow: hidden;
}
.update-card::before {
  content: '';
  position: absolute;
  top: -60px;
  right: -60px;
  width: 180px;
  height: 180px;
  background: var(--accent-gradient);
  opacity: 0.18;
  filter: blur(40px);
  border-radius: 50%;
  z-index: 0;
}
html[dir="rtl"] .update-card::before { right: auto; left: -60px; }

.card-label {
  position: relative;
  z-index: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 0.4px;
}

/* ---- countdown ---- */
.timer {
  position: relative;
  z-index: 1;
  direction: ltr;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 18px 0 6px;
}
.timer-tile {
  flex: 1;
  max-width: 92px;
  padding: 12px 4px 9px;
  border-radius: var(--radius-lg);
  background: var(--chip-bg);
  border: 1px solid var(--border-subtle);
  text-align: center;
}
.timer-value {
  font-family: 'Inter', var(--font-main);
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -0.5px;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  line-height: 1.15;
}
.timer-unit {
  margin-top: 3px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-muted);
}
.timer-colon {
  font-family: 'Inter', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text-muted);
  animation: colonBlink 1s steps(2, start) infinite;
}
@keyframes colonBlink { 50% { opacity: 0.25; } }

.card-note {
  position: relative;
  z-index: 1;
  margin: 12px 0 18px;
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
}

/* ---- primary button (.btn-primary-full from app) ---- */
.btn-primary-full {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 48px;
  border: none;
  border-radius: 24px;
  background: var(--accent-primary);
  color: #fff;
  font-family: var(--font-main);
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 6px 18px var(--accent-glow);
  cursor: pointer;
  transition: transform .25s cubic-bezier(.16,1,.3,1), background .3s ease, box-shadow .3s ease;
}
.btn-primary-full:hover { transform: translateY(-1px); }
.btn-primary-full:active { transform: scale(0.97); }
.btn-primary-full:disabled { cursor: default; }

.btn-primary-full .icon-done { display: none; }
.btn-primary-full .icon-bell { transform-origin: 50% 3px; }
.btn-primary-full.done {
  background: var(--color-green);
  box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
}
.btn-primary-full.done .icon-done { display: block; }
.btn-primary-full.done .icon-bell { display: none; }

/* bell ring on tap */
.btn-primary-full.ringing .icon-bell {
  animation: bellRing 0.85s cubic-bezier(.36,.07,.19,.97) both;
}
@keyframes bellRing {
  0%   { transform: rotate(0); }
  12%  { transform: rotate(16deg); }
  28%  { transform: rotate(-14deg); }
  44%  { transform: rotate(10deg); }
  60%  { transform: rotate(-7deg); }
  76%  { transform: rotate(4deg); }
  100% { transform: rotate(0); }
}

/* ================= FOOTER ================= */
.screen-footer {
  text-align: center;
  padding: 4px 20px calc(16px + env(safe-area-inset-bottom, 0px));
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-family: 'Inter', var(--font-main);
}

/* ================= TOAST ================= */
.toast {
  position: fixed;
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translate(-50%, 26px);
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 9px;
  max-width: calc(100vw - 40px);
  padding: 12px 20px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  background: var(--glass-bg);
  border: 1px solid var(--border-glass);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--shadow-glass);
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease, transform .5s cubic-bezier(.16,1,.3,1);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast svg { color: var(--color-green); flex: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
  </style>
</head>
<body>

  <div class="screen">

    <!-- ================= IMMERSIVE HERO ================= -->
    <div class="hero">
      <div class="hero-topbar">
        <div class="lang-group" role="group" aria-label="Language">
          <button class="lang-btn active" data-lang="en" type="button">English</button>
          <button class="lang-btn" data-lang="fa" type="button">فارسی</button>
        </div>
        <button class="hero-icon-btn" id="theme-btn" type="button" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>

      <section class="hero-glass">
        <span class="hero-glow hero-glow--a" aria-hidden="true"></span>
        <span class="hero-glow hero-glow--b" aria-hidden="true"></span>
        <div class="hero-inner">
          <div class="hero-status">
            <span class="dot"></span>
            <span id="status-text"></span>
          </div>
          <strong class="brand">Walio</strong>
          <p class="hero-tagline" id="hero-tagline"></p>
        </div>
      </section>
    </div>

    <!-- ================= BODY ================= -->
    <main class="body">
      <div class="update-card">
        <div class="card-label" id="timer-label"></div>

        <div class="timer">
          <div class="timer-tile">
            <div class="timer-value" id="t-hours">72</div>
            <div class="timer-unit" id="u-hours">Hours</div>
          </div>
          <span class="timer-colon">:</span>
          <div class="timer-tile">
            <div class="timer-value" id="t-mins">00</div>
            <div class="timer-unit" id="u-mins">Minutes</div>
          </div>
          <span class="timer-colon">:</span>
          <div class="timer-tile">
            <div class="timer-value" id="t-secs">00</div>
            <div class="timer-unit" id="u-secs">Seconds</div>
          </div>
        </div>

        <p class="card-note" id="card-note"></p>

        <button class="btn-primary-full" id="request-btn" type="button">
          <svg class="icon-bell" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <svg class="icon-done" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span id="btn-label"></span>
        </button>
      </div>
    </main>

    <footer class="screen-footer">WALIO · V2.0</footer>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    <span id="toast-text"></span>
  </div>

  <script>
  /* ================= STORAGE HELPERS ================= */
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  };

  /* ================= i18n ================= */
  const I18N = {
    en: {
      dir: 'ltr',
      docTitle: 'Walio — Update in progress',
      status: 'Update in progress',
      tagline: 'Your smart money assistant, getting even better.',
      timerLabel: 'NEW VERSION IN',
      timerLabelDone: 'NEW VERSION',
      units: { h: 'Hours', m: 'Minutes', s: 'Seconds' },
      note: 'Be the first to try the new Walio when it lands.',
      noteDone: 'Releasing any moment now.',
      btn: 'Request New Version',
      btnDone: 'Request Sent',
      toast: 'Your request has been registered'
    },
    fa: {
      dir: 'rtl',
      docTitle: 'والیـو | به‌روزرسانی در حال انجام است',
      status: 'به‌روزرسانی در حال انجام است',
      tagline: 'دستیار هوشمند مالی شما، بهتر از همیشه.',
      timerLabel: 'انتشار نسخهٔ جدید تا',
      timerLabelDone: 'نسخهٔ جدید',
      units: { h: 'ساعت', m: 'دقیقه', s: 'ثانیه' },
      note: 'با انتشار نسخهٔ جدید، شما جزو اولین نفرات خواهید بود.',
      noteDone: 'هر لحظه ممکن است منتشر شود.',
      btn: 'درخواست نسخهٔ جدید',
      btnDone: 'درخواست ثبت شد',
      toast: 'درخواست شما با موفقیت ثبت شد'
    }
  };

  let lang = store.get('walio-lang') === 'fa' ? 'fa' : 'en';
  let requested = store.get('walio-update-requested') === '1';
  let finished = false;

  const $ = id => document.getElementById(id);

  const pad = n => String(n).padStart(2, '0');
  const fmt = (lang, str) => lang === 'fa' ? str.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : str;

  /* ================= COUNTDOWN (72h, persisted) ================= */
  const HOURS_72 = 72 * 3600 * 1000;
  let deadline = parseInt(store.get('walio-update-deadline'), 10);
  if (!deadline || isNaN(deadline)) {
    deadline = Date.now() + HOURS_72;
    store.set('walio-update-deadline', String(deadline));
  }
  /* deadline far in the past or corrupted → start a fresh window */
  if (deadline - Date.now() > HOURS_72) {
    deadline = Date.now() + HOURS_72;
    store.set('walio-update-deadline', String(deadline));
  }

  function renderTimer() {
    const t = I18N[lang];
    const remaining = Math.max(0, deadline - Date.now());
    const totalSecs = Math.floor(remaining / 1000);
    const h = Math.floor(totalSecs / 3600);
    const m = Math.floor((totalSecs % 3600) / 60);
    const s = totalSecs % 60;

    $('t-hours').textContent = fmt(lang, pad(h));
    $('t-mins').textContent = fmt(lang, pad(m));
    $('t-secs').textContent = fmt(lang, pad(s));

    if (remaining <= 0 && !finished) {
      finished = true;
      $('timer-label').textContent = t.timerLabelDone;
      $('card-note').textContent = t.noteDone;
    }
  }

  /* ================= LANGUAGE ================= */
  function applyLang(next) {
    lang = next;
    const t = I18N[lang];
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', t.dir);
    document.title = t.docTitle;

    $('status-text').textContent = t.status;
    $('hero-tagline').textContent = t.tagline;
    $('timer-label').textContent = finished ? t.timerLabelDone : t.timerLabel;
    $('u-hours').textContent = t.units.h;
    $('u-mins').textContent = t.units.m;
    $('u-secs').textContent = t.units.s;
    $('card-note').textContent = finished ? t.noteDone : t.note;
    $('btn-label').textContent = requested ? t.btnDone : t.btn;

    document.querySelectorAll('.lang-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === lang));

    renderTimer();
    store.set('walio-lang', lang);
  }

  document.querySelectorAll('.lang-btn').forEach(btn =>
    btn.addEventListener('click', () => {
      if (btn.dataset.lang !== lang) applyLang(btn.dataset.lang);
    }));

  /* ================= THEME ================= */
  (function () {
    const root = document.documentElement;
    const saved = store.get('walio-theme');
    if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
    $('theme-btn').addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      store.set('walio-theme', next);
    });
  })();

  /* ================= REQUEST BUTTON ================= */
  const requestBtn = $('request-btn');
  const toast = $('toast');
  let toastTimer = null;

  function setDoneState() {
    requestBtn.classList.add('done');
    requestBtn.disabled = true;
    $('btn-label').textContent = I18N[lang].btnDone;
  }

  requestBtn.addEventListener('click', () => {
    if (requested) return;
    /* ring the bell, then settle into the done state */
    requestBtn.classList.add('ringing');
    requestBtn.disabled = true;
    setTimeout(() => {
      requested = true;
      store.set('walio-update-requested', '1');
      requestBtn.classList.remove('ringing');
      setDoneState();
      $('toast-text').textContent = I18N[lang].toast;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }, 850);
  });

  /* ================= INIT ================= */
  if (requested) setDoneState();
  applyLang(lang);
  renderTimer();
  setInterval(renderTimer, 1000);
  </script>
</body>
</html>
